<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieRAG Web</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        color: #1f221c;
        background:
          radial-gradient(circle at top left, rgba(198, 93, 47, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(29, 111, 116, 0.14), transparent 24%),
          linear-gradient(180deg, #f6f1e7 0%, #efe8dc 52%, #ece4d7 100%);
      }

      #root:empty::before {
        content: 'MovieRAG frontend is loading. If this stays here, restart Vite and inspect the browser console.';
        display: block;
        max-width: 760px;
        margin: 72px auto;
        padding: 24px 28px;
        border-radius: 24px;
        background: rgba(255, 252, 247, 0.94);
        border: 1px solid rgba(48, 55, 42, 0.14);
        box-shadow: 0 24px 70px rgba(54, 42, 23, 0.12);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
